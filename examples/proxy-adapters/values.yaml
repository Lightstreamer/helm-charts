logging:
  loggers:
    lightstreamerLogger:

      # Set the logging level for Lightstreamer
      subLoggers:
        init: DEBUG

deployment:
  terminationGracePeriodSeconds: 2

  # ConfigMap created from index.html before installing the chart
  extraVolumes:
    - name: web-volume
      configMap:
        name: example-proxy-adapter-pages

# Serve the index.html web client from the mounted ConfigMap
webServer:
  enabled: true
  pagesVolume:
    name: web-volume

# Allow the web client reached through port forwarding
security:
  crossDomainPolicy:
    allowAccessFrom:
      fromLocalhost:
        enabled: true
        scheme: http
        host: 127.0.0.1
        port: 8080

adapters:

  # Define the adapter set
  exampleProxyAdapterSet:
    enabled: true
    id: EXAMPLE_PROXY_ADAPTER_SET

    # Define the metadata provider
    metadataProvider:

      # Define the In-Process Metadata Adapter
      inProcessMetadataAdapter:
        adapterClass: com.lightstreamer.adapters.metadata.LiteralBasedProvider

    dataProviders:

      # Define the data provider
      myDataProvider:
        enabled: true
        name: MY_PROXY_DATA_ADAPTER

        # Define the Proxy Data Adapter
        proxyDataAdapter:
          requestReplyPort: 6661

